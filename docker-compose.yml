services:
  php:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    container_name: crypto_php
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      BINANCE_API_BASE_URL: ${BINANCE_API_BASE_URL:-https://api.binance.com}
    volumes:
      - .:/var/www/app
      - php_cache:/var/www/app/var/cache
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - crypto_network

  scheduler:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    container_name: crypto_scheduler
    restart: unless-stopped
    command: ["php", "bin/console", "messenger:consume", "scheduler_fetch_crypto_rates", "--no-interaction", "-vv"]
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      BINANCE_API_BASE_URL: ${BINANCE_API_BASE_URL:-https://api.binance.com}
    volumes:
      - .:/var/www/app
      - php_cache:/var/www/app/var/cache
    depends_on:
      php:
        condition: service_healthy
    networks:
      - crypto_network

  nginx:
    image: nginx:1.25-alpine
    container_name: crypto_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/app
      - .docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_healthy
    networks:
      - crypto_network

  mysql:
    image: mysql:8.0
    container_name: crypto_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-crypto_rates}
      MYSQL_USER: ${MYSQL_USER:-crypto}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-crypto}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - crypto_network

volumes:
  mysql_data:
  php_cache:

networks:
  crypto_network:
    driver: bridge
